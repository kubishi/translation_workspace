[project]
name = "yaduha-workspace"
version = "0.1.0"
description = "Development workspace for the Yaduha LLM-RBMT framework and its language packs"
requires-python = ">=3.10"
dependencies = [
    "yaduha",
    "yaduha-ovp",
    "yaduha-bzd",
    "yaduha-grn",
    "yaduha-hch",
    "yaduha-nlv",
    "yaduha-oji",
    "yaduha-yua",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "jupyterlab>=4.2",
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[tool.uv.sources]
yaduha = { path = "./yaduha", editable = true }
yaduha-ovp = { path = "./languages/yaduha-ovp", editable = true }
yaduha-bzd = { path = "./languages/yaduha-bzd", editable = true }
yaduha-grn = { path = "./languages/yaduha-grn", editable = true }
yaduha-hch = { path = "./languages/yaduha-hch", editable = true }
yaduha-nlv = { path = "./languages/yaduha-nlv", editable = true }
yaduha-oji = { path = "./languages/yaduha-oji", editable = true }
yaduha-yua = { path = "./languages/yaduha-yua", editable = true }

[tool.uv]
# setuptools' default editable install (yaduha) uses an import hook that Pylance can't follow; compat mode writes a plain path entry instead.
config-settings = { editable_mode = "compat" }
